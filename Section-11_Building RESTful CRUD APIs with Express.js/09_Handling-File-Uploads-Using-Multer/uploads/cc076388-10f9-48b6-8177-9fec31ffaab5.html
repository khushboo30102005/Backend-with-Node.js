<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Khushi AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Tailwind config (optional nice fonts)
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "Noto Sans", "Ubuntu", "Cantarell", "Helvetica Neue", "Arial", "sans-serif"],
          },
          boxShadow: {
            glow: "0 0 0 2px rgba(99,102,241,.15), 0 10px 25px -5px rgba(99,102,241,.25)",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Minimal scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 999px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="h-full font-sans bg-gradient-to-br from-indigo-50 via-sky-50 to-fuchsia-50 text-slate-800 dark:from-slate-900 dark:via-slate-900 dark:to-slate-950 dark:text-slate-100">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside class="hidden md:flex md:w-72 lg:w-80 flex-col border-r border-white/60 dark:border-white/10 bg-white/60 dark:bg-white/5 backdrop-blur supports-[backdrop-filter]:bg-white/30 supports-[backdrop-filter]:dark:bg-white/5">
      <div class="p-4 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="h-8 w-8 rounded-2xl bg-gradient-to-tr from-indigo-500 to-fuchsia-500 shadow-glow"></div>
          <h2 class="text-lg font-semibold">Khushi <span class="text-indigo-600">AI</span></h2>
        </div>
        <button id="themeToggle" class="rounded-xl px-2.5 py-1 text-sm border border-slate-200/70 dark:border-white/15 hover:bg-white/70 dark:hover:bg-white/10">🌙</button>
      </div>

      <div class="px-4">
        <button id="newChat" class="w-full inline-flex items-center justify-center gap-2 rounded-2xl bg-indigo-600 text-white px-4 py-2.5 shadow-glow hover:opacity-95 active:scale-[.99]">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          New Chat
        </button>
      </div>

      <div class="mt-4 px-4 pb-4 overflow-y-auto">
        <h3 class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-2">Recent</h3>
        <ul id="history" class="space-y-2 text-sm"></ul>
      </div>

      <div class="mt-auto p-4 text-xs text-slate-500/90 dark:text-slate-400/90">v1.0 • Demo UI</div>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col">
      <!-- Top Bar -->
      <header class="sticky top-0 z-10 bg-white/70 dark:bg-slate-900/60 backdrop-blur border-b border-white/60 dark:border-white/10">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="md:hidden h-8 w-8 rounded-2xl bg-gradient-to-tr from-indigo-500 to-fuchsia-500"></div>
            <h1 class="font-semibold">✨ Khushi AI</h1>
            <span id="typing" class="hidden text-xs px-2 py-1 rounded-full bg-indigo-100 text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-200">thinking…</span>
          </div>
          <div class="flex items-center gap-2">
            <button id="clearChat" class="text-xs px-3 py-1.5 rounded-lg border border-slate-200/70 dark:border-white/15 hover:bg-white/70 dark:hover:bg-white/10">Clear</button>
          </div>
        </div>
      </header>

      <!-- Messages -->
      <section id="chat" class="flex-1 overflow-y-auto">
        <div class="max-w-5xl mx-auto px-4 py-6 space-y-4" id="messages">
          <!-- Seed AI welcome message -->
        </div>
      </section>

      <!-- Composer -->
      <footer class="border-t border-white/60 dark:border-white/10 bg-white/70 dark:bg-slate-900/60 backdrop-blur">
        <div class="max-w-5xl mx-auto px-4 py-4">
          <form id="composer" class="flex items-end gap-2">
            <div class="flex-1 relative">
              <textarea id="input" rows="1" placeholder="Type your message… (Shift+Enter for new line)" class="w-full resize-none rounded-2xl border border-slate-200/80 dark:border-white/10 bg-white/80 dark:bg-white/5 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 shadow-sm"></textarea>
              <div class="absolute right-3 bottom-2 flex items-center gap-1.5 text-slate-500">
                <button type="button" id="micBtn" title="Voice (demo)" class="p-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/10">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                </button>
                <button id="sendBtn" class="p-2 rounded-lg bg-indigo-600 text-white hover:opacity-95 shadow-glow" title="Send">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
              </div>
            </div>
          </form>
          <p class="mt-2 text-center text-xs text-slate-500">Khushi AI is a UI demo. No server required.</p>
        </div>
      </footer>
    </main>
  </div>

  <script>
    // --- Utilities ---
    const $ = (sel, el = document) => el.querySelector(sel);
    const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

    const STORAGE_KEY = "khushi_ai_chats";
    const THEME_KEY = "khushi_ai_theme";

    function uid() { return Math.random().toString(36).slice(2, 10); }

    // --- Theme ---
    function applyTheme(theme) {
      const root = document.documentElement;
      if (theme === "dark") root.classList.add("dark"); else root.classList.remove("dark");
      localStorage.setItem(THEME_KEY, theme);
      $("#themeToggle").textContent = theme === "dark" ? "☀️" : "🌙";
    }

    $("#themeToggle")?.addEventListener("click", () => {
      const next = document.documentElement.classList.contains("dark") ? "light" : "dark";
      applyTheme(next);
    });

    // Initialize theme from storage or prefers-color-scheme
    (function initTheme(){
      const saved = localStorage.getItem(THEME_KEY);
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(saved || (prefersDark ? 'dark' : 'light'));
    })();

    // --- Chat state ---
    const state = {
      chats: JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"),
      currentId: null,
    };

    function saveChats() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.chats)); }

    function createChat(title = "New chat") {
      const id = uid();
      const chat = { id, title, messages: [] };
      state.chats.unshift(chat);
      state.currentId = id;
      saveChats();
      renderHistory();
      renderMessages();
    }

    function currentChat() { return state.chats.find(c => c.id === state.currentId); }

    function setCurrent(id) { state.currentId = id; renderHistory(); renderMessages(); }

    // --- Rendering ---
    function renderHistory() {
      const list = $("#history");
      list.innerHTML = "";
      if (!state.chats.length) {
        list.innerHTML = `<li class="text-slate-400">No chats yet</li>`;
        return;
      }
      state.chats.forEach(chat => {
        const li = document.createElement("li");
        li.innerHTML = `
          <button data-id="${chat.id}"
            class="w-full text-left px-3 py-2 rounded-xl border border-slate-200/70 dark:border-white/10 bg-white/70 dark:bg-white/5 hover:bg-white/90 dark:hover:bg-white/10 ${chat.id === state.currentId ? 'ring-2 ring-indigo-500/40' : ''}">
            <span class="line-clamp-1">${chat.title || 'Untitled'}</span>
          </button>`;
        list.appendChild(li);
      });
      // click handlers
      $$("[data-id]", list).forEach(btn => btn.addEventListener('click', () => setCurrent(btn.dataset.id)));
    }

    function bubbleHTML(role, text) {
      const isUser = role === 'user';
      return `
        <div class="flex ${isUser ? 'justify-end' : 'justify-start'}">
          <div class="max-w-[85%] md:max-w-[70%] rounded-2xl px-4 py-3 shadow ${isUser ? 'bg-indigo-600 text-white' : 'bg-white/90 dark:bg-white/10 border border-slate-200/70 dark:border-white/10'}">
            ${text.replace(/\n/g, '<br>')}
          </div>
        </div>`;
    }

    function renderMessages() {
      const container = $("#messages");
      container.innerHTML = "";
      const chat = currentChat();
      if (!chat) return;
      if (!chat.messages.length) {
        container.insertAdjacentHTML('beforeend', bubbleHTML('ai', `Hello 👋 I’m <b>Khushi AI</b>. How can I help you today?`));
      } else {
        chat.messages.forEach(m => {
          container.insertAdjacentHTML('beforeend', bubbleHTML(m.role, m.text));
        });
      }
      // scroll to bottom
      requestAnimationFrame(() => { container.parentElement.scrollTop = container.parentElement.scrollHeight; });
    }

    // --- Composer logic ---
    const form = $("#composer");
    const input = $("#input");
    const typing = $("#typing");

    // autosize textarea
    function autosize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    }
    input.addEventListener('input', autosize);
    autosize();

    form.addEventListener('submit', (e) => e.preventDefault());

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      const chat = currentChat();
      chat.messages.push({ role: 'user', text });
      chat.title = chat.title === 'New chat' && text ? (text.length > 28 ? text.slice(0, 28) + '…' : text) : chat.title || text.slice(0, 28);
      saveChats();
      renderHistory();
      renderMessages();
      input.value = '';
      autosize();
      simulateAIReply(text);
    }

    function simulateAIReply(userText) {
      typing.classList.remove('hidden');
      // A simple, local demo reply — replace with your API call
      const reply = `You said: “${userText.replace(/</g, '&lt;').replace(/>/g, '&gt;')}”.\n\nThis is a demo UI. Hook your backend or API to generate real answers ✨`;
      setTimeout(() => {
        typing.classList.add('hidden');
        const chat = currentChat();
        if (!chat) return;
        chat.messages.push({ role: 'ai', text: reply });
        saveChats();
        renderMessages();
      }, 600 + Math.min(1800, userText.length * 20));
    }

    $("#sendBtn").addEventListener('click', sendMessage);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Mic demo
    $("#micBtn").addEventListener('click', () => {
      const supports = 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;
      if (!supports) { alert('Speech recognition not available in this browser.'); return; }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const rec = new SR();
      rec.lang = 'en-US';
      rec.interimResults = false;
      rec.onresult = (e) => {
        input.value = e.results[0][0].transcript;
        autosize();
      };
      rec.onerror = () => alert('Voice input error.');
      rec.start();
    });

    // Clear + New chat
    $("#clearChat").addEventListener('click', () => {
      const chat = currentChat();
      if (!chat) return;
      if (confirm('Clear messages in this chat?')) { chat.messages = []; saveChats(); renderMessages(); }
    });

    $("#newChat").addEventListener('click', () => createChat('New chat'));

    // Bootstrap app
    (function init(){
      if (!state.chats.length) createChat('New chat');
      else { state.currentId = state.chats[0].id; renderHistory(); renderMessages(); }
    })();
  </script>
</body>
</html>
